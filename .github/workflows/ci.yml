name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Assert the must-NOT-compile type tests still fail
        run: pnpm typecheck:negative

      - name: Check formatting (prettier)
        run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

      - name: Smoke-test the built entrypoint loads in raw Node
        run: node --input-type=module -e "import('./dist/index.js').then(m => { if (typeof m.withOpenFeature !== 'function') { throw new Error('withOpenFeature missing from dist') } })"

      # The floor is TypeScript 5.4 (`NoInfer`), pinned in test/ts-floor. This
      # package emits `NoInfer` into its published .d.ts, so it inherits the
      # engine's floor (see middleware commit b673919).
      - name: Typecheck a consumer against the published types at TypeScript 5.4
        run: pnpm typecheck:consumer

      # Compiles handlers/ and providers/ with no runtime globals available, so
      # a handler that reaches for `process` or `Deno` fails here rather than at
      # deploy time. Each runtime's entry points are checked by its own
      # toolchain; see examples/README.md.
      - name: Typecheck the examples against the built package
        run: pnpm typecheck:examples

      # Match import specifiers, not the bare string `node:` — the doc comments
      # in src/types.ts mention `node:events` when explaining why the package
      # avoids @openfeature/server-sdk, and a naive grep fails on a clean tree.
      - name: "Assert Rule 7 — no node: imports in this package's own source"
        run: |
          if grep -rnE "(from|import|require)\s*\(?\s*['\"]node:" src/; then
            echo "Rule 7 violation: node: import in src/"
            exit 1
          fi
          echo "Rule 7 OK"

  # Both smoke jobs below assert only the credential-free path: a probe that
  # needs a live Vercel/PostHog credential reports `blocked`, not a failure, so
  # neither job needs repo secrets and both run safely on fork PRs.
  smoke-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - run: pnpm smoke:deno

  smoke-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1

      - run: pnpm install --frozen-lockfile

      # `supabase start` boots the function at container startup, so the
      # vendored package it imports has to exist before the stack starts, not
      # after — `_vendor/` is gitignored and doesn't survive a fresh checkout.
      - name: Build and vendor the package into the smoke function
        run: pnpm smoke:edge:vendor

      - name: Start the local stack (gateway + edge runtime only)
        run: supabase start --workdir smoke/edge

      - run: pnpm exec vitest run --config smoke/edge/vitest.config.ts

      - name: Stop the local stack
        if: always()
        run: supabase stop --workdir smoke/edge
