# Ports are offset so this stack coexists with the CLI defaults (54321),
# @supabase/server's e2e stack (54331) and this repo's smoke stack (54341).
project_id = "middleware-openfeature-examples"

[api]
enabled = true
port = 54351

[db]
port = 54352
shadow_port = 54350
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = true

# Read from the shell, so nothing secret is committed. Before `supabase start`:
#   set -a; . ../../../smoke/.env; set +a
[edge_runtime.secrets]
FLAGS = "env(FLAGS)"
POSTHOG_API_KEY = "env(POSTHOG_API_KEY)"
POSTHOG_HOST = "env(POSTHOG_HOST)"
SUPABASE_JWKS_URL = "env(SUPABASE_JWKS_URL)"

# withClaims is what should reject a bad token, not the gateway — so the JWT
# pre-check is off even on the claims functions.
[functions.vercel-basic]
verify_jwt = false
[functions.vercel-claims]
verify_jwt = false
[functions.posthog-basic]
verify_jwt = false
[functions.posthog-claims]
verify_jwt = false
